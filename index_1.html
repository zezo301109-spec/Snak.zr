<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>snak.zr 3D</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020712;
    font-family:Arial,sans-serif;
    color:white;
    touch-action:none;
}

.game{
    position:relative;
    width:100%;
    max-width:500px;
    height:100%;
    margin:auto;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 45%,
        #12375c 0%,
        #07172b 38%,
        #020712 78%
    );
}

/* =========================
   خلفية 3D
========================= */

.grid3d{
    position:absolute;
    width:150%;
    height:80%;
    left:-25%;
    bottom:-12%;

    transform:
        perspective(500px)
        rotateX(62deg);

    background:
    linear-gradient(
        rgba(30,100,170,.18) 1px,
        transparent 1px
    ),
    linear-gradient(
        90deg,
        rgba(30,100,170,.18) 1px,
        transparent 1px
    );

    background-size:40px 40px;
    opacity:.65;
}

/* =========================
   مكعبات الخلفية
========================= */

.cube{
    position:absolute;
    width:48px;
    height:48px;

    transform:
        rotate(45deg)
        perspective(400px)
        rotateX(12deg);

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            #315b91,
            #0c1d38
        );

    box-shadow:
        0 0 25px
        rgba(0,110,255,.25);

    opacity:.6;
}

.c1{top:17%;left:-20px;}
.c2{top:29%;right:-20px;width:65px;height:65px;}
.c3{top:46%;left:15px;width:34px;height:34px;}
.c4{top:58%;right:18px;width:42px;height:42px;}
.c5{bottom:15%;left:-20px;width:62px;height:62px;}
.c6{bottom:7%;right:20px;width:35px;height:35px;}

/* =========================
   العنوان
========================= */

.header{
    position:absolute;
    z-index:20;
    top:12px;
    left:0;
    right:0;
    text-align:center;
}

.crown{
    color:#00ef83;
    font-size:23px;
    margin-bottom:-5px;

    text-shadow:
        0 0 15px
        rgba(0,255,120,.7);
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:-2px;

    text-shadow:
        0 5px 0 #062b19,
        0 0 18px
        rgba(0,255,120,.35);
}

.logo span{
    color:#00ef83;
}

/* =========================
   Score
========================= */

.stats{
    position:absolute;
    z-index:20;
    top:23px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;
}

.stat{
    width:105px;
    padding:7px 5px;
    text-align:center;

    border:
        1px solid
        rgba(60,140,240,.55);

    border-radius:17px;

    background:
        rgba(2,12,28,.78);

    backdrop-filter:blur(8px);

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.25);
}

.label{
    color:#9eafc8;
    font-size:11px;
    letter-spacing:1px;
}

.value{
    font-size:26px;
    font-weight:bold;
}

/* =========================
   Canvas
========================= */

#gameCanvas{
    position:absolute;
    z-index:5;

    width:min(90vw,400px);
    height:min(90vw,400px);

    left:50%;
    top:51%;

    transform:
        translate(-50%,-50%);

    touch-action:none;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(0,0,0,.5)
        );
}

/* =========================
   الشاشات
========================= */

.screen{
    position:absolute;
    inset:0;
    z-index:50;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle,
            rgba(8,40,65,.62),
            rgba(1,6,14,.95)
        );

    backdrop-filter:blur(6px);
}

.hidden{
    display:none!important;
}

.bigLogo{
    font-size:54px;
    font-weight:900;
    margin-bottom:32px;

    text-shadow:
        0 6px 0 #062b19,
        0 0 25px
        rgba(0,255,120,.35);
}

.bigLogo span{
    color:#00ef83;
}

/* =========================
   PLAY
========================= */

.play,
.retry{
    width:270px;
    height:62px;

    border:
        2px solid
        #00ef83;

    border-radius:35px;

    color:white;

    background:
        linear-gradient(
            145deg,
            rgba(0,255,130,.18),
            rgba(0,100,70,.12)
        );

    font-size:22px;
    font-weight:bold;

    box-shadow:
        0 0 22px
        rgba(0,255,130,.4),

        inset 0 0 18px
        rgba(0,255,130,.08);
}

.play:active,
.retry:active{
    transform:scale(.96);
}

.instructions{
    margin-top:23px;
    padding:13px 25px;

    border:
        1px solid
        rgba(60,130,220,.4);

    border-radius:30px;

    background:
        rgba(3,13,28,.78);

    color:#d7e2f2;

    text-align:center;
    font-size:14px;
    line-height:1.6;
}

/* =========================
   GAME OVER
========================= */

.overTitle{
    font-size:43px;
    font-weight:900;
    margin-bottom:22px;

    text-shadow:
        0 0 10px #ff2020,
        0 0 30px
        rgba(255,0,0,.65);
}

.result{
    width:285px;
    padding:18px;

    display:flex;
    justify-content:space-around;

    border:
        1px solid
        rgba(70,140,230,.5);

    border-radius:20px;

    background:
        rgba(3,13,28,.9);

    margin-bottom:22px;
}

.result div{
    text-align:center;
}

.result span{
    display:block;
    color:#9eafc8;
    font-size:11px;
    margin-bottom:5px;
}

.result strong{
    font-size:29px;
}

.home{
    width:210px;
    height:47px;
    margin-top:12px;

    border:
        1px solid
        #3675cc;

    border-radius:25px;

    background:
        rgba(10,35,75,.7);

    color:white;

    font-size:15px;
    font-weight:bold;
}

/* =========================
   Music
========================= */

.music{
    position:absolute;
    z-index:60;

    top:95px;
    right:16px;

    width:42px;
    height:42px;

    border-radius:50%;

    border:
        1px solid
        #3975c7;

    background:
        rgba(3,15,32,.85);

    color:white;

    font-size:18px;
}

/* =========================
   +1
========================= */

.plus{
    position:absolute;
    z-index:40;
    pointer-events:none;

    color:#65ff85;
    font-size:28px;
    font-weight:bold;

    text-shadow:
        0 0 15px #00ff66;

    animation:
        plusUp .7s ease-out forwards;
}

@keyframes plusUp{
    from{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

    to{
        opacity:0;
        transform:
            translateY(-55px)
            scale(1.3);
    }
}

</style>
</head>

<body>

<div class="game">

    <div class="grid3d"></div>

    <div class="cube c1"></div>
    <div class="cube c2"></div>
    <div class="cube c3"></div>
    <div class="cube c4"></div>
    <div class="cube c5"></div>
    <div class="cube c6"></div>

    <!-- HEADER -->

    <div class="header">

        <div class="crown">
            ♛
        </div>

        <div class="logo">
            snak<span>.zr</span>
        </div>

    </div>

    <!-- SCORE -->

    <div class="stats">

        <div class="stat">

            <div class="label">
                SCORE
            </div>

            <div
                class="value"
                id="score">
                0
            </div>

        </div>

        <div class="stat">

            <div class="label">
                BEST
            </div>

            <div
                class="value"
                id="best">
                0
            </div>

        </div>

    </div>

    <!-- MUSIC -->

    <button
        class="music"
        id="musicBtn">
        🔊
    </button>

    <!-- GAME -->

    <canvas
        id="gameCanvas"
        width="400"
        height="400">
    </canvas>

    <!-- START -->

    <div
        class="screen"
        id="startScreen">

        <div class="bigLogo">
            snak<span>.zr</span>
        </div>

        <button
            class="play"
            id="playBtn">

            ▶ &nbsp; PLAY

        </button>

        <div class="instructions">

            ☝️<br>

            اسحب بإصبعك
            لتحريك الدودة

        </div>

    </div>

    <!-- GAME OVER -->

    <div
        class="screen hidden"
        id="gameOverScreen">

        <div class="bigLogo">
            snak<span>.zr</span>
        </div>

        <div class="overTitle">
            GAME OVER
        </div>

        <div class="result">

            <div>

                <span>SCORE</span>

                <strong
                    id="finalScore">
                    0
                </strong>

            </div>

            <div>

                <span>BEST</span>

                <strong
                    id="finalBest">
                    0
                </strong>

            </div>

        </div>

        <div style="margin-bottom:12px">
            محاولة جديدة؟
        </div>

        <button
            class="retry"
            id="retryBtn">

            ↻ &nbsp; PLAY AGAIN

        </button>

        <button
            class="home"
            id="homeBtn">

            ⌂ &nbsp; MAIN MENU

        </button>

    </div>

</div>

<script>

/* =====================================
   إعدادات
===================================== */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");

const SIZE = 400;
const BOX = 20;
const GRID = 20;


/* =====================================
   حالة اللعبة
===================================== */

let snake = [];
let food = {};

let direction = "RIGHT";
let nextDirection = null;

let score = 0;

let best =
    Number(
        localStorage.getItem(
            "snakzrBest"
        )
    ) || 0;

let speed = 145;

let running = false;

let lastMove = 0;

let animationId = null;

let particles = [];


/* =====================================
   عناصر
===================================== */

const scoreEl =
    document.getElementById(
        "score"
    );

const bestEl =
    document.getElementById(
        "best"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const gameOverScreen =
    document.getElementById(
        "gameOverScreen"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const finalBest =
    document.getElementById(
        "finalBest"
    );

bestEl.textContent = best;


/* =====================================
   الموسيقى
===================================== */

let audioContext = null;
let musicTimer = null;
let musicOn = true;

function startMusic(){

    if(!musicOn)
        return;

    if(!audioContext){

        audioContext =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }

    if(musicTimer)
        return;

    const notes = [
        261.63,
        329.63,
        392.00,
        329.63,
        293.66,
        349.23,
        440.00,
        349.23
    ];

    let index = 0;

    function playNote(){

        if(
            !musicOn ||
            !audioContext
        )
            return;

        const osc =
            audioContext
            .createOscillator();

        const gain =
            audioContext
            .createGain();

        osc.type = "sine";

        osc.frequency.value =
            notes[
                index %
                notes.length
            ];

        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .025,
            audioContext.currentTime + .04
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + .7
        );

        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );

        osc.start();

        osc.stop(
            audioContext.currentTime + .75
        );

        index++;
    }

    playNote();

    musicTimer =
        setInterval(
            playNote,
            900
        );
}

function toggleMusic(){

    musicOn = !musicOn;

    document
        .getElementById("musicBtn")
        .textContent =
        musicOn
        ? "🔊"
        : "🔇";

    if(musicOn){

        startMusic();

    }else{

        clearInterval(
            musicTimer
        );

        musicTimer = null;
    }
}


/* =====================================
   الطعام
===================================== */

function createFood(){

    do{

        food = {

            x:
                (
                    Math.floor(
                        Math.random() * 18
                    ) + 1
                ) * BOX,

            y:
                (
                    Math.floor(
                        Math.random() * 18
                    ) + 1
                ) * BOX
        };

    }while(

        snake.some(
            p =>
                p.x === food.x &&
                p.y === food.y
        )
    );
}


/* =====================================
   بدء اللعبة
===================================== */

function startGame(){

    cancelAnimationFrame(
        animationId
    );

    snake = [

        {
            x:9 * BOX,
            y:10 * BOX
        },

        {
            x:8 * BOX,
            y:10 * BOX
        },

        {
            x:7 * BOX,
            y:10 * BOX
        }

    ];

    /*
      أهم إصلاح:
      الاتجاه يبدأ يمين تلقائيًا
    */

    direction = "RIGHT";

    nextDirection = null;

    score = 0;

    speed = 145;

    particles = [];

    scoreEl.textContent = "0";

    createFood();

    running = true;

    lastMove =
        performance.now();

    startScreen
        .classList
        .add("hidden");

    gameOverScreen
        .classList
        .add("hidden");

    startMusic();

    draw();

    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =====================================
   زيادة السرعة
===================================== */

function updateSpeed(){

    speed =
        Math.max(
            55,
            145 -
            Math.floor(
                score / 5
            ) * 10
        );
}


/* =====================================
   تغيير الاتجاه
===================================== */

function changeDirection(dir){

    if(!running)
        return;

    if(
        dir === "LEFT" &&
        direction !== "RIGHT"
    ){

        nextDirection = "LEFT";
    }

    if(
        dir === "RIGHT" &&
        direction !== "LEFT"
    ){

        nextDirection = "RIGHT";
    }

    if(
        dir === "UP" &&
        direction !== "DOWN"
    ){

        nextDirection = "UP";
    }

    if(
        dir === "DOWN" &&
        direction !== "UP"
    ){

        nextDirection = "DOWN";
    }
}


/* =====================================
   Touch Swipe
===================================== */

let startX = 0;
let startY = 0;

canvas.addEventListener(
    "touchstart",
    e => {

        const t =
            e.touches[0];

        startX =
            t.clientX;

        startY =
            t.clientY;

        e.preventDefault();

    },
    {
        passive:false
    }
);

canvas.addEventListener(
    "touchend",
    e => {

        const t =
            e.changedTouches[0];

        const dx =
            t.clientX -
            startX;

        const dy =
            t.clientY -
            startY;

        if(
            Math.abs(dx) < 15 &&
            Math.abs(dy) < 15
        )
            return;

        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            changeDirection(
                dx > 0
                ? "RIGHT"
                : "LEFT"
            );

        }else{

            changeDirection(
                dy > 0
                ? "DOWN"
                : "UP"
            );
        }

        e.preventDefault();

    },
    {
        passive:false
    }
);


/* =====================================
   Particles
===================================== */

function createParticles(x,y){

    for(
        let i=0;
        i<20;
        i++
    ){

        particles.push({

            x:x+10,

            y:y+10,

            vx:
                (Math.random()-.5)
                * 6,

            vy:
                (Math.random()-.5)
                * 6,

            life:1
        });
    }
}

function updateParticles(){

    particles.forEach(
        p => {

            p.x += p.vx;
            p.y += p.vy;
            p.life -= .055;

        }
    );

    particles =
        particles.filter(
            p =>
                p.life > 0
        );
}

function drawParticles(){

    particles.forEach(
        p => {

            ctx.globalAlpha =
                p.life;

            ctx.fillStyle =
                "#ff3030";

            ctx.fillRect(
                p.x,
                p.y,
                4,
                4
            );
        }
    );

    ctx.globalAlpha = 1;
}


/* =====================================
   3D Cube
===================================== */

function draw3DCube(
    x,
    y,
    size,
    mainColor,
    glow
){

    const depth = 5;

    ctx.shadowColor =
        glow;

    ctx.shadowBlur =
        14;

    ctx.fillStyle =
        mainColor;

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        size,
        size,
        5
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    /* الجانب */

    ctx.fillStyle =
        "rgba(0,0,0,.30)";

    ctx.beginPath();

    ctx.moveTo(
        x + size,
        y + 4
    );

    ctx.lineTo(
        x + size + depth,
        y + depth
    );

    ctx.lineTo(
        x + size + depth,
        y + size + depth
    );

    ctx.lineTo(
        x + size,
        y + size
    );

    ctx.closePath();

    ctx.fill();

    /* الأسفل */

    ctx.fillStyle =
        "rgba(0,0,0,.38)";

    ctx.beginPath();

    ctx.moveTo(
        x + 4,
        y + size
    );

    ctx.lineTo(
        x + size,
        y + size
    );

    ctx.lineTo(
        x + size + depth,
        y + size + depth
    );

    ctx.lineTo(
        x + depth,
        y + size + depth
    );

    ctx.closePath();

    ctx.fill();
}


/* =====================================
   خلفية الملعب
===================================== */

function drawBackground(){

    ctx.clearRect(
        0,
        0,
        SIZE,
        SIZE
    );

    ctx.strokeStyle =
        "rgba(50,110,170,.16)";

    ctx.lineWidth = 1;

    for(
        let i=0;
        i<=SIZE;
        i+=BOX
    ){

        ctx.beginPath();

        ctx.moveTo(
            i,
            0
        );

        ctx.lineTo(
            i,
            SIZE
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            0,
            i
        );

        ctx.lineTo(
            SIZE,
            i
        );

        ctx.stroke();
    }

    /* الحواجز */

    for(
        let x=0;
        x<SIZE;
        x+=BOX
    ){

        draw3DCube(
            x+2,
            2,
            16,
            "#e71919",
            "#ff2020"
        );

        draw3DCube(
            x+2,
            382,
            16,
            "#e71919",
            "#ff2020"
        );
    }

    for(
        let y=20;
        y<380;
        y+=BOX
    ){

        draw3DCube(
            2,
            y+2,
            16,
            "#e71919",
            "#ff2020"
        );

        draw3DCube(
            382,
            y+2,
            16,
            "#e71919",
            "#ff2020"
        );
    }
}


/* =====================================
   الطعام
===================================== */

function drawFood(){

    const pulse =
        1 +
        Math.sin(
            performance.now() / 160
        ) * .12;

    ctx.save();

    ctx.translate(
        food.x+10,
        food.y+10
    );

    ctx.scale(
        pulse,
        pulse
    );

    ctx.translate(
        -10,
        -10
    );

    draw3DCube(
        2,
        2,
        16,
        "#ff3333",
        "#ff2020"
    );

    ctx.restore();
}


/* =====================================
   رسم الدودة
===================================== */

function drawSnake(){

    snake.forEach(
        (part,index) => {

            const isHead =
                index === 0;

            const gradient =
                ctx.createLinearGradient(
                    part.x,
                    part.y,
                    part.x+BOX,
                    part.y+BOX
                );

            gradient.addColorStop(
                0,
                isHead
                ? "#7aff8c"
                : "#43ed67"
            );

            gradient.addColorStop(
                1,
                "#00a940"
            );

            ctx.shadowColor =
                "#00ff68";

            ctx.shadowBlur = 9;

            draw3DCube(
                part.x+2,
                part.y+2,
                16,
                gradient,
                "#00ff68"
            );

            ctx.shadowBlur = 0;

            /* العين */

            if(isHead){

                ctx.fillStyle =
                    "#06120a";

                if(
                    direction === "LEFT" ||
                    direction === "RIGHT"
                ){

                    ctx.beginPath();

                    ctx.arc(
                        part.x+6,
                        part.y+6,
                        2.5,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();

                    ctx.beginPath();

                    ctx.arc(
                        part.x+6,
                        part.y+14,
                        2.5,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();

                }else{

                    ctx.beginPath();

                    ctx.arc(
                        part.x+6,
                        part.y+6,
                        2.5,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();

                    ctx.beginPath();

                    ctx.arc(
                        part.x+14,
                        part.y+6,
                        2.5,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();
                }
            }
        }
    );
}


/* =====================================
   الحركة
===================================== */

function moveSnake(){

    if(!direction)
        return;

    if(nextDirection){

        direction =
            nextDirection;

        nextDirection =
            null;
    }

    let headX =
        snake[0].x;

    let headY =
        snake[0].y;

    if(
        direction === "LEFT"
    )
        headX -= BOX;

    if(
        direction === "RIGHT"
    )
        headX += BOX;

    if(
        direction === "UP"
    )
        headY -= BOX;

    if(
        direction === "DOWN"
    )
        headY += BOX;

    /* الحواجز */

    if(
        headX < 20 ||
        headY < 20 ||
        headX >= 380 ||
        headY >= 380
    ){

        endGame();

        return;
    }

    const ate =
        headX === food.x &&
        headY === food.y;

    if(!ate)
        snake.pop();

    /* اصطدام بالنفس */

    if(
        snake.some(
            p =>
                p.x === headX &&
                p.y === headY
        )
    ){

        endGame();

        return;
    }

    snake.unshift({

        x:headX,
        y:headY

    });

    /* أكل */

    if(ate){

        score++;

        scoreEl.textContent =
            score;

        if(score > best){

            best = score;

            localStorage.setItem(
                "snakzrBest",
                best
            );

            bestEl.textContent =
                best;
        }

        createParticles(
            food.x,
            food.y
        );

        showPlusOne(
            food.x,
            food.y
        );

        createFood();

        updateSpeed();
    }
}


/* =====================================
   Game Loop — 60 FPS
===================================== */

function gameLoop(timestamp){

    if(!running)
        return;

    updateParticles();

    if(
        timestamp -
        lastMove >=
        speed
    ){

        moveSnake();

        /*
          حساب الوقت بشكل أفضل
          عشان الحركة ما تتأخرش
        */

        lastMove += speed;

        if(
            timestamp -
            lastMove >
            speed
        ){

            lastMove =
                timestamp;
        }
    }

    draw();

    animationId =
        requestAnimationFrame(
            gameLoop
        );
}


/* =====================================
   الرسم
===================================== */

function draw(){

    drawBackground();

    drawFood();

    drawSnake();

    drawParticles();
}


/* =====================================
   +1
===================================== */

function showPlusOne(
    x,
    y
){

    const plus =
        document.createElement(
            "div"
        );

    plus.className =
        "plus";

    plus.textContent =
        "+1";

    const rect =
        canvas.getBoundingClientRect();

    plus.style.left =
        (
            rect.left +
            (x/400) *
            rect.width
        ) + "px";

    plus.style.top =
        (
            rect.top +
            (y/400) *
            rect.height
        ) + "px";

    document
        .querySelector(".game")
        .appendChild(
            plus
        );

    setTimeout(
        () => plus.remove(),
        700
    );
}


/* =====================================
   Game Over
===================================== */

function endGame(){

    running = false;

    cancelAnimationFrame(
        animationId
    );

    finalScore.textContent =
        score;

    finalBest.textContent =
        best;

    gameOverScreen
        .classList
        .remove("hidden");
}


/* =====================================
   الأزرار
===================================== */

document
    .getElementById("playBtn")
    .addEventListener(
        "click",
        startGame
    );

document
    .getElementById("retryBtn")
    .addEventListener(
        "click",
        startGame
    );

document
    .getElementById("homeBtn")
    .addEventListener(
        "click",
        () => {

            running = false;

            cancelAnimationFrame(
                animationId
            );

            gameOverScreen
                .classList
                .add("hidden");

            startScreen
                .classList
                .remove("hidden");
        }
    );

document
    .getElementById("musicBtn")
    .addEventListener(
        "click",
        toggleMusic
    );


/* =====================================
   البداية
===================================== */

snake = [
    {
        x:9*BOX,
        y:10*BOX
    },
    {
        x:8*BOX,
        y:10*BOX
    },
    {
        x:7*BOX,
        y:10*BOX
    }
];

direction = "RIGHT";

createFood();

draw();

</script>
